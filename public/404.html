<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B192C" />
    <meta name="robots" content="noindex" />
    <title>Page not found — الصفحة غير موجودة | Smart Bonus</title>
    <style>
      :root { --navy: #0B192C; --amber: #D97706; --gray: #6B7280; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: linear-gradient(180deg, #0B192C 0%, #0f2238 50%, #0B192C 100%);
        color: #ffffff;
        font-family: "Cairo", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 560px; width: 100%; }
      .code { font-size: 72px; font-weight: 800; color: var(--amber); line-height: 1; margin: 0 0 12px; }
      h1 { font-size: 28px; font-weight: 700; margin: 0 0 12px; line-height: 1.3; }
      p { color: rgba(255, 255, 255, 0.8); line-height: 1.7; margin: 0 0 8px; font-size: 16px; }
      .en { direction: ltr; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
      .btn {
        display: inline-block;
        margin-top: 28px;
        padding: 14px 32px;
        border-radius: 9999px;
        background: var(--amber);
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
        font-size: 16px;
      }
      .btn:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }
      @media (max-width: 380px) {
        .code { font-size: 56px; }
        h1 { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" dir="ltr" aria-hidden="true">404</p>
      <h1>الصفحة غير موجودة</h1>
      <p>الرابط الذي فتحته غير صحيح أو تم نقله.</p>
      <div class="en">
        <h1 style="font-size:22px">Page not found</h1>
        <p>The link you followed is broken or the page has moved.</p>
      </div>
      <a class="btn" href="/">الرئيسية / Home</a>
    </main>
  </body>
</html>
